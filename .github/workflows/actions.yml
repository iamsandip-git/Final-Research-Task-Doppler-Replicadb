
name: Deploy to EC2

on:
  push:
    branches: [final-task-doppler-replicadb]

env:
  EC2_USER: ubuntu
  APP_DIR: /home/ubuntu/app
  DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }} 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH from Github to EC2
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Copy repository Github to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_IP }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "."
          target: "${{ env.APP_DIR }}"
          strip_components: 1
          debug: true

      - name: Deploy with Doppler
        uses: appleboy/ssh-action@v0.1.10
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        with:
          host: ${{ secrets.EC2_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs: DOPPLER_TOKEN
          script: |
            cd ${{ env.APP_DIR }}
            sudo curl -Ls https://cli.doppler.com/install | sudo bash
            doppler run --project final-research-task --config cicd_cicd_deploy -- docker compose down -v
            doppler run --project final-research-task --config cicd_cicd_deploy -- docker system prune -af
            doppler run --project final-research-task --config cicd_cicd_deploy -- docker compose build --no-cache
            doppler run --project final-research-task --config cicd_cicd_deploy -- docker compose up -d --force-recreate